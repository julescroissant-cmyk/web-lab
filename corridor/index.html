             { v: 'news-06' }, { p: 'qkyXoi0LyFw' }, { p: '8dPnqTP9ZMQ' }, { p: 'iUCg5P910BI' },
             { p: '6hVDoIzw_54' }, { p: 'rXt_DtUoa3c' },
             { p: '7i5tEs8q1yc' }, { p: 'PDy3RpQTktw' }, { v: 'news-07' }, { p: 'IkO56jyz2-c' }, { p: 'LNldcBoiNbk' }, { p: 'xOWNDgb_kDo' } ] },
  { id: 'direction', title: 'Direction de la production éditoriale', years: '2025 — 2026', role: 'Directeur de production éditoriale',

             { p: 'PxbymaIm_0k' }, { p: 'oQNhcCQ11QU' }, { p: 'A-tHMViRwKM' },
             { g: 'Coulisses', photos: ['direction-06', 'direction-07'] }, { p: '9X2Wn5pQ9kw' }, { p: 'VxhJTdN2q6k' } ] },
  { id: 'head', title: 'Head of Production', years: '2026 — aujourd’hui', role: 'Konbini',
    text: 'Co-direction du département Production, éditorial et brand content.',
    items: [ { p: 'GVqOtVfTAd4' } ] },
  { id: 'bureau', title: 'Bureau en bordel', years: '', role: 'Exposition',
    text: 'Huit bureaux, aucun rangement.',
    items: ['bureau-01', 'bureau-02', 'bureau-03', 'bureau-04', 'bureau-05', 'bureau-06', 'bureau-07', 'bureau-08'].map(ph => ({ ph })) },
];
const STEPS = STAGES.filter(st => !st.intro), stepOf = st => st.intro ? 'Intro' : `Étape ${STEPS.indexOf(st) + 1} / ${STEPS.length}`;
const RATIO = {"etudes-01": 1.3333, "etudes-02": 0.75, "etudes-03": 0.75, "etudes-04": 1.4679, "konbini-01": 0.75, "konbini-02": 1.3333, "konbini-03": 0.75, "konbini-04": 0.75, "konbini-05": 0.75, "konbini-06": 1.3333, "konbini-07": 0.9867, "konbini-08": 0.6227, "konbini-09": 1.3333, "news-01": 0.75, "news-02": 0.75, "news-03": 1.3333, "news-04": 0.75, "news-05": 0.75, "news-06": 0.5625, "news-07": 0.5625, "news-08": 0.75, "news-09": 0.75, "news-10": 0.75, "news-11": 0.75, "news-12": 0.75, "news-13": 0.75, "news-14": 0.75, "direction-01": 0.75, "direction-02": 0.75, "direction-03": 0.75, "direction-04": 1.0, "direction-05": 1.0, "direction-06": 1.3333, "direction-07": 0.75, "direction-08": 1.3333, "direction-09": 0.75, "direction-10": 1.2537, "direction-11": 0.75, "direction-12": 1.3333, "direction-13": 0.75, "bureau-01": 0.75, "bureau-02": 0.75, "bureau-03": 1.3333, "bureau-04": 1.3333, "bureau-05": 1.3333, "bureau-06": 0.75, "bureau-07": 0.75, "bureau-08": 0.75};

// ================= Couloir : un chemin qui ondule, s = distance le long =================
const W = 6, H = 4, START = 6, D = 3, UP = new THREE.Vector3(0, 1, 0);
const center = s => new THREE.Vector3(Math.sin(s * .06) * 5 + Math.sin(s * .023) * 3, Math.sin(s * .04) * .8, -s);
function frame(s) {
  const c = center(s), T = center(s + .01).sub(c).normalize();
  const R = new THREE.Vector3().crossVectors(T, UP).normalize();
  const U = new THREE.Vector3().crossVectors(R, T);
  return { c, T, R, U };
}
const at = (s, a, b) => { const f = frame(s); return f.c.addScaledVector(f.R, a).addScaledVector(f.U, b); };
let seed = 11; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;

// Accrochage : espacements, côtés, hauteurs et tailles irréguliers (mais toujours les mêmes d'une visite à l'autre)
const ENTRIES = [];
{ let s = START, prevSide = 1, prevW = 0;
  const hang = (e, w, h, gap, yJit) => {
    const side = e.kind === 'panel' ? -prevSide : (rnd() < .68 ? -prevSide : prevSide);
    if (side === prevSide) gap = Math.max(gap, prevW / 2 + w / 2 + .35);
    s += gap;
    let y = (rnd() - .5) * yJit; y = Math.min(Math.max(y, -1.75 + h / 2), 1.75 - h / 2);
    ENTRIES.push({ ...e, s, side, w, h, y }); prevSide = side; prevW = w;
  };
  STAGES.forEach((st, si) => {
    if (si) s += 2.5;
    hang({ kind: 'panel', stage: st }, 1.9, 2.4, si ? 2.5 : 0, .1);
    const expo = st.id === 'bureau';
    st.items.forEach((it, k) => {
      const first = k === 0 ? 1.4 : 0;
      if (it.p) { const w = 2.7 + rnd() * .5; hang({ kind: 'project', stage: st, yt: it.p, info: PROJECTS[it.p] }, w, w * 9 / 16, first + 1.6 + rnd() * 2.6, .5); }
      else if (it.v) { const h = 1.9 + rnd() * .3; hang({ kind: 'video', stage: st, id: it.v }, h * 9 / 16, h, first + 1.4 + rnd() * 2.2, .3); }
      else {
        const id = it.ph || it.photos[0], r = RATIO[id], m = expo ? .55 + rnd() * .55 : .8 + rnd() * .3;
        let w = 2.1 * m, h = w / r; if (h > 1.7 * m) { h = 1.7 * m; w = h * r; }
        const e = it.ph ? { kind: 'photo', stage: st, id } : { kind: 'group', stage: st, id, title: it.g, text: it.text || '', photos: it.photos };
        hang(e, w, h, first + (expo ? .8 + rnd() * 1 : 1.2 + rnd() * 2.4), expo ? 1.6 : .7);
      }
    });
  });
}
const COUNT = ENTRIES.length;
const S_MIN = -16, S_LAST = ENTRIES[COUNT - 1].s, S_END = S_LAST + 24, S_MAX_CAM = S_LAST - 3;
STAGES.forEach(st => { const list = ENTRIES.filter(e => e.stage === st && e.kind !== 'panel'); list.forEach((e, k) => { e.n = k + 1; e.of = list.length; }); });

// ================= Scène =================
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
catch (e) { loading.textContent = 'WebGL indisponible sur ce navigateur.'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
// jour / nuit : suit le thème du système, y compris quand il change pendant la visite
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
const THEMES = {
  day:   { bg: 0xffffff, line: [.12, .33, .94], frame: 0x1f54f0, empty: 0xe9eefc, ghost: 0xf4f6fe, badge: '#1f54f0',
           panel: { bg: '#ffffff', border: '#1f54f0', dim: '#6b7391', text: '#0f1a3d', role: '#1f54f0' } },
  night: { bg: 0x0b0806, line: [1, .6, .26], frame: 0xffa24a, empty: 0x1e1611, ghost: 0x241a13, badge: '#d9712a',
           panel: { bg: '#120d09', border: '#ffa24a', dim: '#a8988a', text: '#f6ece2', role: '#ffa24a' } },
};
let TH = darkMQ.matches ? THEMES.night : THEMES.day;
scene.background = new THREE.Color(TH.bg);
scene.fog = new THREE.FogExp2(TH.bg, .05);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, .05, 200);
scene.add(camera); // les images ouvertes vivent devant la caméra

const pts = [], seg = (p, q) => pts.push(p.x, p.y, p.z, q.x, q.y, q.z);
for (let s = S_MIN; s <= S_END; s += 1.5) {
  const c = [[-W/2,-H/2],[W/2,-H/2],[W/2,H/2],[-W/2,H/2]].map(([a, b]) => at(s, a, b));
  for (let i = 0; i < 4; i++) seg(c[i], c[(i + 1) % 4]);
}
const rails = [];
for (let a = -W/2; a <= W/2 + 1e-6; a += 1) rails.push([a, -H/2], [a, H/2]);
for (let b = -H/2 + 1; b <= H/2 - 1 + 1e-6; b += 1) rails.push([-W/2, b], [W/2, b]);
for (const [a, b] of rails) { let prev = at(S_MIN, a, b);
  for (let s = S_MIN + .5; s <= S_END; s += .5) { const p = at(s, a, b); seg(prev, p); prev = p; } }
const gridGeo = new THREE.BufferGeometry();
gridGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
const NL = 8, lightPos = Array.from({ length: NL }, () => new THREE.Vector3(0, -999, 0)), lightPow = new Array(NL).fill(0);
const gridMat = new THREE.ShaderMaterial({
  uniforms: { uL: { value: lightPos }, uP: { value: lightPow }, uCam: { value: new THREE.Vector3() },
    uBg: { value: new THREE.Color(TH.bg) }, uLine: { value: new THREE.Vector3(...TH.line) } },
  vertexShader: `varying vec3 vW;
    void main(){ vec4 w = modelMatrix * vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `#define N ${NL}
    uniform vec3 uL[N]; uniform float uP[N]; uniform vec3 uCam; uniform vec3 uBg; uniform vec3 uLine; varying vec3 vW;
    void main(){
      float glow = 0.;
      for(int i=0;i<N;i++){ vec3 d = vW - uL[i]; glow += uP[i] * exp(-dot(d,d) * .09); }
      float k = (.38 + .62 * clamp(glow, 0., 1.)) * exp(-length(vW - uCam) * .05);
      gl_FragColor = vec4(mix(uBg, uLine, k), 1.);
    }`,

scene.add(new THREE.LineSegments(gridGeo, gridMat));
await document.fonts.ready;

const aniso = renderer.capabilities.getMaxAnisotropy();
const tex = t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = aniso; return t; };
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d')); return tex(new THREE.CanvasTexture(c)); }
function panelTexture(st, idx) {

const badgeTexture = n => canvasTex(160, 80, g => {

  g.fillStyle = '#fff'; g.font = '500 44px "JetBrains Mono", monospace'; g.textAlign = 'center'; g.fillText(`+${n}`, 80, 56);

// ================= Accrochage =================
const UNIT = new THREE.PlaneGeometry(1, 1), EDGE = new THREE.EdgesGeometry(new THREE.PlaneGeometry(1, 1));
const FRAMES = [], GHOSTS = [], EMPTIES = [];
function framed(mat, w, h) {

  const f = new THREE.LineSegments(EDGE, new THREE.LineBasicMaterial({ color: TH.frame })); FRAMES.push(f.material);
  f.scale.set(1 + .12 / w, 1 + .12 / h, 1); mesh.add(f); mesh.userData.frame = f;
  return mesh;
}
const loader = new THREE.TextureLoader().setCrossOrigin('anonymous');
function loadInto(mat, url, done) { loader.load(url, t => { mat.map = tex(t); mat.color.set(0xffffff); mat.needsUpdate = true; done?.(); }); }
// miniature YouTube : maxresdefault n'existe pas toujours (YouTube répond alors par une image grise de 120 px)
function ytInto(mat, id, done) {
  const set = (t, crop) => { if (crop) { t.repeat.set(1, .75); t.offset.set(0, .125); } mat.map = tex(t); mat.color.set(0xffffff); mat.needsUpdate = true; done?.(); };
  const hq = () => loader.load(`https://i.ytimg.com/vi/${id}/hqdefault.jpg`, t => set(t, true));
  loader.load(`https://i.ytimg.com/vi/${id}/maxresdefault.jpg`, t => t.image.width > 200 ? set(t, false) : (t.dispose(), hq()), undefined, hq);
}

const arts = [];
let stageNo = 0;
for (const e of ENTRIES) {
  if (e.kind === 'panel' && !e.stage.intro) stageNo++;
  const f = frame(e.s), side = e.side;
  const z = f.R.clone().multiplyScalar(-side), y = f.U.clone(), x = new THREE.Vector3().crossVectors(y, z);
  const wallQuat = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z));
  const wallPos = f.c.clone().addScaledVector(f.R, side * (W / 2 - .04)).addScaledVector(f.U, e.y);
  const mat = new THREE.MeshBasicMaterial({ color: e.kind === 'panel' ? 0xffffff : TH.empty,
    map: e.kind === 'panel' ? panelTexture(e.stage, e.stage.intro ? 'INTRO' : String(stageNo).padStart(2, '0') + ' / ' + STEPS.length) : null });
  const mesh = framed(mat, e.w, e.h);
  if (e.kind === 'panel') mesh.userData.frame.visible = false;
  mesh.position.copy(wallPos); mesh.quaternion.copy(wallQuat); scene.add(mesh);
  const a = { ...e, mesh, mat, wallPos, wallQuat, light: wallPos.clone().addScaledVector(f.R, -side * 1.2),
    t: 0, hover: 0, pow: 0, loaded: e.kind === 'panel', loading: false, video: null, extra: [], cell: null, badge: null };
  if (e.kind === 'group' && e.photos.length > 1) {
    // pile : un ou deux cadres décalés derrière + pastille « +N »
    for (let j = 1; j <= Math.min(2, e.photos.length - 1); j++) {
      const ghost = framed(new THREE.MeshBasicMaterial({ color: TH.ghost }), e.w, e.h); GHOSTS.push(ghost.material);
      ghost.position.copy(wallPos).addScaledVector(x, .12 * j).addScaledVector(y, -.1 * j).addScaledVector(z, -.004 * j);
      ghost.quaternion.copy(wallQuat).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), .035 * j * side));
      scene.add(ghost);
    }
    const badge = new THREE.Mesh(new THREE.PlaneGeometry(.36, .18), new THREE.MeshBasicMaterial({ map: badgeTexture(e.photos.length - 1) }));
    badge.position.copy(wallPos).addScaledVector(x, e.w / 2 - .12).addScaledVector(y, e.h / 2 + .02).addScaledVector(z, .01);
    badge.quaternion.copy(wallQuat); scene.add(badge); a.badge = badge;
    a.extra = e.photos.slice(1).map((id, k) => ({ id, ratio: RATIO[id], mesh: null, t: 0, delay: .12 + k * .09, start: new THREE.Vector3(), rz: 0 }));
  }
  arts.push(a);
}
const covers = arts.map(a => a.mesh);
function applyTheme() {
  TH = darkMQ.matches ? THEMES.night : THEMES.day;
  scene.background.set(TH.bg); scene.fog.color.set(TH.bg);
  gridMat.uniforms.uBg.value.set(TH.bg); gridMat.uniforms.uLine.value.set(...TH.line);
  FRAMES.forEach(m => m.color.set(TH.frame)); GHOSTS.forEach(m => m.color.set(TH.ghost));
  let n = 0;
  for (const a of arts) {
    if (a.kind === 'panel') { if (!a.stage.intro) n++; a.mat.map.dispose(); a.mat.map = panelTexture(a.stage, a.stage.intro ? 'INTRO' : String(n).padStart(2, '0') + ' / ' + STEPS.length); a.mat.needsUpdate = true; }
    else if (!a.mat.map) a.mat.color.set(TH.empty);
    if (a.badge) { a.badge.material.map.dispose(); a.badge.material.map = badgeTexture(a.photos.length - 1); a.badge.material.needsUpdate = true; }
  }
}
darkMQ.addEventListener('change', applyTheme);
loading.remove();

// Chargement paresseux des images du mur (important sur téléphone)
const NEAR = 30, FAR = 45;
function stream(a, dist) {
  if (a.kind === 'panel') return;
  if (dist < NEAR && !a.loaded && !a.loading) {
    a.loading = true; const done = () => { a.loaded = true; a.loading = false; };
    if (a.kind === 'project') ytInto(a.mat, a.yt, done);
    else if (a.kind === 'video') {
      const v = document.createElement('video');
      Object.assign(v, { src: `media/${a.id}.mp4`, poster: `media/${a.id}.jpg`, muted: true, loop: true, playsInline: true, preload: 'auto' });
      v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
      a.video = v; v.play().catch(() => {});
      a.mat.map = tex(new THREE.VideoTexture(v)); a.mat.color.set(0xffffff); a.mat.needsUpdate = true; done();
    } else loadInto(a.mat, `media/${a.id}.jpg`, done);
  } else if (dist > FAR && a.loaded && a !== selected && a.t < .001) {
    a.mat.map.dispose(); a.mat.map = null; a.mat.color.set(TH.empty); a.mat.needsUpdate = true; a.loaded = false;
    if (a.video) { a.video.pause(); a.video.removeAttribute('src'); a.video.load(); a.video = null; }
  }
}

// ================= Ouverture : l'image vient devant, ses voisines de groupe arrivent de hors champ =================
const tanH = () => Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
function region() {
  const hh = tanH() * D, hw = hh * camera.aspect;
  const X = px => (px / innerWidth * 2 - 1) * hw, Y = py => (1 - py / innerHeight * 2) * hh;
  const top = document.querySelector('header').getBoundingClientRect().bottom + 12;
  if (innerWidth > 700) {
    const bottom = document.querySelector('footer').getBoundingClientRect().top - 8;
    return { x0: X(28), x1: X(innerWidth - 28 - card.offsetWidth - 24), y0: Y(bottom), y1: Y(top), hw, hh };
  }
  return { x0: X(16), x1: X(innerWidth - 16), y0: Y(card.offsetTop - 12), y1: Y(top), hw, hh };
}
// grille qui maximise la surface des images dans la zone libre
function layout(ratios, R) {
  let best = null;
  for (let cols = 1; cols <= ratios.length; cols++) {
    const rows = Math.ceil(ratios.length / cols), cw = (R.x1 - R.x0) / cols, ch = (R.y1 - R.y0) / rows;
    let area = 0;
    const sz = ratios.map(r => { let w = cw * .92, h = w / r; if (h > ch * .92) { h = ch * .92; w = h * r; } area += w * h; return [w, h]; });
    if (!best || area > best.area) best = { cols, cw, ch, sz, area };
  }
  return best.sz.map(([w, h], k) => {
    const row = k / best.cols | 0, col = k % best.cols, inRow = Math.min(best.cols, ratios.length - row * best.cols);
    const off = (best.cols - inRow) * best.cw / 2;
    return { p: new THREE.Vector3(R.x0 + off + (col + .5) * best.cw, R.y1 - (row + .5) * best.ch, -D), w, h };
  });
}
// mode « focus » : une photo du groupe en grand, les autres en bandeau dessous
function focusLayout(ratios, R, f) {
  const H = R.y1 - R.y0, split = R.y0 + H * .24;
  const big = layout([ratios[f]], { ...R, y0: split })[0];
  const rest = ratios.map((r, k) => k).filter(k => k !== f);
  const strip = layout(rest.map(k => ratios[k]), { ...R, y1: split });
  const out = []; out[f] = big; rest.forEach((k, j) => out[k] = strip[j]);
  // bandeau : toujours sur une ligne
  if (rest.length) {
    const cw = (R.x1 - R.x0) / rest.length;
    rest.forEach((k, j) => { const r = ratios[k]; let h = (split - R.y0) * .86, w = h * r; if (w > cw * .9) { w = cw * .9; h = w / r; }
      out[k] = { p: new THREE.Vector3(R.x0 + (j + .5) * cw, R.y0 + (split - R.y0) / 2, -D), w, h }; });
  }
  return out;
}
const chase = (cur, cell) => { if (!cur.p) { cur.p = cell.p.clone(); cur.w = cell.w; cur.h = cell.h; } return cur; };
function place(a, reset = true) {
  const R = region(), ratios = [a.w / a.h, ...a.extra.map(m => m.ratio)];
  const cells = a.focus != null ? focusLayout(ratios, R, a.focus) : layout(ratios, R);
  a.cell = cells[0]; if (reset) a.cur = { p: null }; chase(a.cur, a.cell);
  a.extra.forEach((m, k) => {
    m.cell = cells[k + 1]; if (reset) m.cur = { p: null }; chase(m.cur, m.cell);
    if (!reset) return;
    const from = k % 2 ? 1 : -1;  // alternativement de gauche et de droite, hors champ
    m.start.set(from * (R.hw + m.cell.w), (rnd() - .5) * R.hh * 1.4, -D);
    m.rz = from * (.4 + rnd() * .5);
    if (!m.mesh) {
      const mat = new THREE.MeshBasicMaterial({ color: TH.empty, depthTest: false });
      m.mesh = framed(mat, 1, 1); m.mesh.renderOrder = 10; m.mesh.userData.frame.material.depthTest = false; m.mesh.visible = false;
      camera.add(m.mesh); loadInto(mat, `media/${m.id}.jpg`);
    }
  });
}

let selected = null, hovered = null, openedAt = 0;
const clock = new THREE.Clock();
const label = a => ({ panel: a.stage.title, project: a.info?.title, group: a.title, video: 'Showreel', photo: a.stage.title })[a.kind] || '';
function row(k, v) { if (!v) return; const dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = k; dd.textContent = v; cardMeta.append(dt, dd); }
function open(a) {
  selected = a; sT = s; openedAt = clock.elapsedTime; a.focus = null;
  const st = a.stage, sn = STAGES.indexOf(st) + 1;
  cardIdx.textContent = a.kind === 'panel' ? stepOf(st) : `${st.title} · ${String(a.n).padStart(2, '0')} / ${a.of}`;
  cardMeta.innerHTML = ''; cardLink.hidden = true; cardHint.textContent = '';
  if (a.kind === 'panel') { cardTitle.textContent = st.title; cardText.textContent = st.text; row('Années', st.years); row(st.intro ? 'Aujourd’hui' : 'Poste', st.role); }
  else if (a.kind === 'project') {
    cardTitle.textContent = a.info.title; cardText.textContent = a.info.text;
    row('Format', a.info.format); row('Année', a.info.year); row('Chaîne', 'Konbini');
    cardLink.href = `https://youtu.be/${a.yt}`; cardLink.hidden = false;
  } else if (a.kind === 'group') { cardTitle.textContent = a.title; cardText.textContent = a.text; row('Photos', String(a.photos.length));}
  else if (a.kind === 'video') { cardTitle.textContent = 'Showreel Konbini News'; cardText.textContent = ''; cardHint.textContent = 'Son activé · toucher pour fermer'; }
  else { cardTitle.textContent = ''; cardText.textContent = ''; }
  if (a.video) { a.video.muted = false; a.video.currentTime = 0; a.video.play().catch(() => {}); }
  card.classList.add('on');
  place(a);
}
function close() { if (selected?.video) selected.video.muted = true; selected = null; card.classList.remove('on'); hidePlayer(); }
// lecteur YouTube : remplace la miniature une fois qu'elle est arrivée devant
let playerFor = null;
function hidePlayer() { if (!playerFor) return; playerFor = null; player.classList.remove('on'); player.innerHTML = ''; }
function syncPlayer() {
  const a = selected;
  if (!a || a.kind !== 'project' || a.t < .97) { if (playerFor && playerFor !== a) hidePlayer(); return; }
  const hh = tanH() * D, hw = hh * camera.aspect, c = a.cur;
  const W_ = c.w / (2 * hw) * innerWidth, H_ = c.h / (2 * hh) * innerHeight;
  const x = (c.p.x / hw * .5 + .5) * innerWidth - W_ / 2, y = (.5 - c.p.y / hh * .5) * innerHeight - H_ / 2;
  Object.assign(player.style, { left: x + 'px', top: y + 'px', width: W_ + 'px', height: H_ + 'px' });
  if (playerFor !== a) {
    playerFor = a; player.classList.add('on');
    player.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${a.yt}?rel=0&playsinline=1" title="${a.info.title.replace(/"/g, '&quot;')}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  }
}

// ================= Interactions =================
let s = S_MIN + 4, sT = 0, mx = 0, my = 0, mxT = 0, myT = 0, yaw = 0, yawT = 0;
const clampS = v => Math.min(Math.max(v, 0), S_MAX_CAM);
const nearest = v => arts.reduce((b, a) => Math.abs(a.s - v - 4) < Math.abs(b.s - v - 4) ? a : b);
const ndc = new THREE.Vector2(-9, -9), ray = new THREE.Raycaster();
const pick = () => { ray.setFromCamera(ndc, camera); const h = ray.intersectObjects(covers, false)[0];
  return h && h.distance < 14 ? arts[covers.indexOf(h.object)] : null; };
const go = dir => { const n = arts[Math.min(Math.max(nearest(sT).i + dir, 0), COUNT - 1)]; sT = clampS(n.s - 4); }; // -4 : même repère que nearest()
arts.forEach((a, i) => a.i = i);

addEventListener('pointermove', e => {
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  if (e.pointerType === 'mouse') { mxT = ndc.x; myT = ndc.y; }
});
addEventListener('pointerdown', e => ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1));
renderer.domElement.addEventListener('click', () => {
  if (dragged) return;
  if (selected) {
    return close();
  }
  const a = pick(); if (a) open(a);
});
addEventListener('wheel', e => { e.preventDefault(); if (!selected) sT = clampS(sT + e.deltaY * .012); }, { passive: false });
let touchX = null, touchY = null, axis = null, dragged = false;
addEventListener('touchstart', e => { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; axis = null; dragged = false; }, { passive: true });
addEventListener('touchmove', e => {
  const x = e.touches[0].clientX, y = e.touches[0].clientY, dx = x - touchX, dy = y - touchY;
  if (!axis) { if (Math.hypot(dx, dy) < 6) return; axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'; dragged = true; }
  if (!selected) {
    if (axis === 'x') yawT = Math.min(Math.max(yawT + dx * .003, -.45), .45);
    else { sT = clampS(sT - dy * .03); yawT *= .92; }
  }
  touchX = x; touchY = y;
}, { passive: true });
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if (k === 'escape') return close();
  if (k === 'enter' || k === ' ') return selected ? close() : open(nearest(s));
  if (selected) close();
  if (['arrowup','w','z'].includes(k)) sT = clampS(sT + 2.5);
  if (['arrowdown','s'].includes(k)) sT = clampS(sT - 2.5);
  if (['arrowright','d'].includes(k)) go(1);
  if (['arrowleft','a','q'].includes(k)) go(-1);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); if (selected) place(selected, false);
});

// ================= Boucle =================
const tmpQ = new THREE.Quaternion(), tmpV = new THREE.Vector3(), mid = new THREE.Vector3(), target = new THREE.Vector3(), normal = new THREE.Vector3();
const smooth = t => t * t * (3 - 2 * t);
let lastIdx = -1, lastStage = null;

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), time = clock.elapsedTime;
  const k = 1 - Math.exp(-dt * 4);
  s += (sT - s) * k; mx += (mxT - mx) * k; my += (myT - my) * k; yaw += (yawT - yaw) * k;

  const f = frame(s);
  camera.position.copy(f.c).addScaledVector(f.U, -.25 + Math.sin(time * .8) * .02);
  camera.lookAt(center(s + 5).setY(center(s + 5).y - .25));
  camera.rotateY(-mx * .35 + yaw); camera.rotateX(my * .2);
  camera.updateMatrixWorld();
  gridMat.uniforms.uCam.value.copy(camera.position);

  hovered = selected ? null : pick();
  renderer.domElement.style.cursor = hovered || selected ? 'pointer' : '';

  for (const a of arts) {
    const d = Math.abs(a.s - s), isOpen = a === selected;
    stream(a, d);
    const busy = a.t > .001 || a.extra.some(m => m.t > .002);
    if (d > FAR && !isOpen && !busy) { a.mesh.visible = false; continue; }
    a.mesh.visible = true;
    a.t += ((isOpen ? 1 : 0) - a.t) * (1 - Math.exp(-dt * 5));
    a.hover += ((a === hovered ? 1 : 0) - a.hover) * k;
    const kc = 1 - Math.exp(-dt * 9);
    if (a.cur?.p) { a.cur.p.lerp(a.cell.p, kc); a.cur.w += (a.cell.w - a.cur.w) * kc; a.cur.h += (a.cell.h - a.cur.h) * kc; }
    if (a.t > .001 && a.cell) {
      const e = smooth(a.t);
      normal.set(0, 0, 1).applyQuaternion(a.wallQuat);
      mid.copy(a.wallPos).addScaledVector(normal, 1.4);
      target.copy(a.cur.p); camera.localToWorld(target);
      a.mesh.position.copy(a.wallPos).multiplyScalar((1 - e) ** 2).addScaledVector(mid, 2 * e * (1 - e)).addScaledVector(target, e * e);
      a.mesh.quaternion.slerpQuaternions(a.wallQuat, camera.quaternion, e).multiply(tmpQ.setFromAxisAngle(UP, Math.sin(e * Math.PI) * .6 * a.side));
      a.mesh.scale.set(a.w + (a.cur.w - a.w) * e, a.h + (a.cur.h - a.h) * e, 1); a.mesh.userData.frame.scale.set(1 + .08 / a.mesh.scale.x, 1 + .08 / a.mesh.scale.y, 1);
      a.mesh.renderOrder = e > .5 ? 9 : 0; a.mat.depthTest = e < .5;
    } else {
      a.mesh.position.copy(a.wallPos); a.mesh.quaternion.copy(a.wallQuat);
      const sc = 1 + a.hover * .05; a.mesh.scale.set(a.w * sc, a.h * sc, 1); a.mesh.userData.frame.scale.set(1 + .12 / a.mesh.scale.x, 1 + .12 / a.mesh.scale.y, 1); a.mesh.renderOrder = 0; a.mat.depthTest = true;
    }
    if (a.badge) a.badge.visible = a.t < .02;
    for (const m of a.extra) {
      if (!m.mesh) continue;
      const goIn = isOpen && time - openedAt > m.delay;
      m.t += ((goIn ? 1 : 0) - m.t) * (1 - Math.exp(-dt * (goIn ? 4.5 : 9)));
      m.mesh.visible = m.t > .002;
      if (!m.mesh.visible) continue;
      m.cur.p.lerp(m.cell.p, kc); m.cur.w += (m.cell.w - m.cur.w) * kc; m.cur.h += (m.cell.h - m.cur.h) * kc;
      const e = smooth(m.t);
      m.mesh.position.lerpVectors(m.start, m.cur.p, e);
      m.mesh.rotation.set(0, 0, m.rz * (1 - e));
      m.mesh.scale.set(m.cur.w, m.cur.h, 1); m.mesh.userData.frame.scale.set(1 + .08 / m.cur.w, 1 + .08 / m.cur.h, 1);
    }
    const near = Math.max(0, 1 - Math.abs(a.s - s - 3) / 7);
    a.pow += (near * 1.1 + a.hover * .6 + (isOpen ? 1.2 : 0) - a.pow) * k;
  }
  const lit = arts.filter(a => Math.abs(a.s - s) < 20).sort((p, q) => q.pow - p.pow).slice(0, NL);
  for (let j = 0; j < NL; j++) { const a = lit[j]; if (a) { lightPos[j].copy(a.light); lightPow[j] = a.pow; } else lightPow[j] = 0; }

  const cur = nearest(s);
  if (cur.i !== lastIdx) {
    lastIdx = cur.i;
    idx.textContent = cur.kind === 'panel' ? stepOf(cur.stage) : `${String(cur.n).padStart(2, '0')} / ${cur.of}`;
    title.textContent = label(cur);
    if (cur.stage !== lastStage) { lastStage = cur.stage;
      meta.innerHTML = ''; const b = document.createElement('b'); b.textContent = cur.stage.title;
      meta.append(b, document.createTextNode(cur.stage.years || cur.stage.role)); }
  }
  bar.style.width = `${Math.max(0, s / S_MAX_CAM) * 100}%`;
  syncPlayer();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
