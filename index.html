<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web Lab</title>
<style>
  :root { --bg:#fafaf8; --fg:#111; --dim:#777; --line:#ddd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --dim:#888; --line:#333; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px;
    background:var(--bg); color:var(--fg); font:15px/1.5 ui-monospace, Menlo, monospace; }
  main { width:100%; max-width:520px; }
  h1 { font-size:13px; font-weight:500; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin:0 0 20px; }
  a { display:flex; justify-content:space-between; gap:16px; padding:18px 0; border-top:1px solid var(--line);
    color:inherit; text-decoration:none; }
  a:last-child { border-bottom:1px solid var(--line); }
  a:hover b { text-decoration:underline; }
  span { color:var(--dim); }
</style>
</head>
<body>
<main>
  <h1>Web Lab</h1>
  <a href="corridor/"><b>Corridor</b><span>galerie 3D →</span></a>
  <a href="desktop/"><b>Desktop</b><span>portfolio bureau →</span></a>
</main>
</body>
</html>
