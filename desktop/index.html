<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alex — Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Pixelify+Sans:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --face:#dcd9d1; --face2:#e9e7e1; --hi:#ffffff; --lo:#86837b; --dk:#151515;
    --title:linear-gradient(90deg,#2f3fbf,#6d7ff0); --title-off:linear-gradient(90deg,#7d7b76,#b3b1ab);
    --sel:#3448c8; --ink:#141414;
    --pix:'Pixelify Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
    --tb:36px;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#4f8fd8; color:var(--ink); font:400 13px/1.5 var(--mono); }
  #wall { position:fixed; inset:0; width:100%; height:100%; background:center/cover no-repeat; }
  button { font:inherit; color:inherit; }

  /* ---- Win98 bevels ---- */
  .raised { background:var(--face); box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--lo), inset 2px 2px var(--face2); }
  .sunken { box-shadow:inset 1px 1px var(--lo), inset -1px -1px var(--hi), inset 2px 2px var(--dk), inset -2px -2px var(--face2); }
  .btn { all:unset; box-sizing:border-box; cursor:pointer; padding:7px 14px 6px; font:500 13px/1 var(--pix); text-align:center;
    background:var(--face); box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--lo), inset 2px 2px var(--face2); }
  .btn:active, .btn[aria-pressed="true"] { box-shadow:inset 1px 1px var(--dk), inset -1px -1px var(--hi), inset 2px 2px var(--lo), inset -2px -2px var(--face2); padding:8px 13px 5px 15px; }
  .btn:focus-visible { outline:1px dotted var(--ink); outline-offset:-5px; }
  .field { font:13px/1.4 var(--mono); background:#fff; border:0; padding:5px 7px; width:100%;
    box-shadow:inset 1px 1px var(--lo), inset -1px -1px var(--hi), inset 2px 2px var(--dk), inset -2px -2px var(--face2); }
  .field:focus { outline:1px dotted var(--ink); outline-offset:-4px; }

  /* ---- Desktop icons ---- */
  .icons { position:fixed; inset:0 0 var(--tb) 0; }
  .icon { all:unset; position:absolute; width:96px; display:grid; justify-items:center; gap:5px; cursor:default; touch-action:none; user-select:none; }
  /* dropped-item float: bob + sway on `translate`/`rotate`, hover/press on `scale` so they combine */
  .sprite { position:relative; width:64px; height:64px; pointer-events:none;
    animation:bob 2.8s ease-in-out var(--d,0s) infinite; transition:scale .35s cubic-bezier(.34,1.8,.5,1); }
  .sprite img { display:block; width:64px; height:64px; image-rendering:pixelated; }
  /* varnish: a light band sweeps across, clipped to the sprite's own pixels */
  .sprite i { position:absolute; inset:0; -webkit-mask:var(--m) 0 0/100% 100%; mask:var(--m) 0 0/100% 100%;
    background:linear-gradient(115deg,#fff0 38%,#fffc 47%,#fff0 49%,#fff0 52%,#fff8 54%,#fff0 60%) 130% 0/300% 100% no-repeat;
    animation:shine 6s ease-in-out var(--d,0s) infinite; }
  @keyframes shine { 0%,72% { background-position:130% 0; } 100% { background-position:-30% 0; } }
  .icon::before { content:''; position:absolute; top:60px; left:50%; width:44px; height:8px; margin-left:-22px; border-radius:50%;
    background:radial-gradient(#0006,#0000 70%); animation:shadow 2.8s ease-in-out var(--d,0s) infinite; pointer-events:none; }
  @keyframes bob { 0%,100% { translate:0 0; rotate:-3deg; } 50% { translate:0 -7px; rotate:3deg; } }
  @keyframes shadow { 0%,100% { scale:1; opacity:1; } 50% { scale:.7; opacity:.55; } }
  .icon:hover .sprite { scale:1.15; animation-duration:1.1s; }
  .icon:hover .sprite i { animation:shine-now .7s ease-out; }
  @keyframes shine-now { from { background-position:130% 0; } to { background-position:-30% 0; } }
  .icon:active .sprite { scale:.9; transition-duration:.08s; }
  .icon span { font:500 12px/1.25 var(--pix); color:#fff; padding:1px 4px; text-align:center; text-shadow:0 1px 2px #000a, 0 0 1px #000; }
  .icon.sel .sprite img { filter:brightness(.75) sepia(.4) hue-rotate(190deg) saturate(2.5); }
  .icon.sel span { background:var(--sel); text-shadow:none; outline:1px dotted #fff; }
  .icon:focus-visible span { outline:1px dotted #fff; }

  /* ---- Windows ---- */
  .win { position:fixed; display:none; flex-direction:column; width:var(--w,420px); max-width:calc(100vw - 16px); padding:3px;
    filter:drop-shadow(0 14px 24px #0003); }
  .win.open { display:flex; animation:pop .14s ease-out; }
  .win.min { display:none; }
  .win.max { left:0 !important; top:0 !important; width:100vw !important; max-width:none; height:calc(100vh - var(--tb)) !important; max-height:none !important; }
  @keyframes pop { from { transform:scale(.96); } }
  .title { display:flex; align-items:center; gap:6px; height:22px; padding:0 3px 0 5px; background:var(--title-off); color:#fff;
    font:500 12px/1 var(--pix); letter-spacing:.02em; user-select:none; touch-action:none; cursor:default; flex:none; }
  .win.active .title { background:var(--title); }
  .title .ti { width:16px; height:16px; image-rendering:pixelated; }
  .title span { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ctl { display:flex; gap:2px; }
  .ctl button { all:unset; width:18px; height:16px; display:grid; place-items:center; cursor:pointer; color:var(--ink); font:600 11px/1 var(--pix);
    background:var(--face); box-shadow:inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--lo), inset 2px 2px var(--face2); }
  .ctl button:active { box-shadow:inset 1px 1px var(--dk), inset -1px -1px var(--hi), inset 2px 2px var(--lo); }
  .ctl button[data-a="close"] { margin-left:2px; }
  .content { padding:14px; overflow:auto; flex:1; min-height:0; }

  /* hello.exe */
  .who { display:flex; gap:16px; align-items:center; }
  .avatar { width:72px; height:72px; /* 64px content = exact 2× of the 32px sprite */ image-rendering:pixelated; background:#bfe3ff; flex:none;
    box-shadow:inset 1px 1px var(--lo), inset -1px -1px var(--hi), inset 2px 2px var(--dk), inset -2px -2px var(--face2); padding:4px; }
  .who h1 { margin:0; font:600 clamp(26px,3.4vw,34px)/1.05 var(--pix); letter-spacing:-.01em; }
  .who p { margin:6px 0 0; font:400 14px/1.35 var(--pix); color:#3c3a36; }
  .bio { margin:16px 0 14px; font-size:13.5px; line-height:1.6; }
  .status { display:inline-flex; align-items:center; gap:8px; background:#fff; padding:6px 10px 6px 9px; font:500 12.5px/1 var(--mono); }
  .status i { width:9px; height:9px; background:#2fbf4f; box-shadow:0 0 0 1px #1a7d30; animation:blink 2.4s steps(1) infinite; }
  @keyframes blink { 50% { opacity:.35; } }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .hint { margin:14px 0 0; font-size:11.5px; color:#6c6a64; }

  /* explorer */
  .bar2 { display:flex; align-items:center; gap:8px; padding:0 0 10px; font:500 12px var(--pix); }
  .files { background:#fff; padding:12px; display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px; min-height:180px; }
  .file { all:unset; display:grid; justify-items:center; gap:6px; padding:6px 4px; cursor:default; text-align:center; font:12px/1.25 var(--pix); }
  .file canvas { width:72px; height:54px; image-rendering:pixelated; box-shadow:0 0 0 1px #0003, 0 3px 6px #0002; }
  .bar2 .up { padding:4px 9px 3px; } .bar2 .up:disabled { color:#9a978f; cursor:default; }
  .file img.folder { width:54px; height:54px; object-fit:contain; box-shadow:none; image-rendering:pixelated; }
  .file img { width:96px; height:54px; object-fit:cover; box-shadow:0 0 0 1px #0003, 0 3px 6px #0002; }
  .files { grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); }
  .player { aspect-ratio:16/9; background:#000; }
  .player iframe { display:block; width:100%; height:100%; border:0; }
  .win[data-id="player"] .content { padding:6px; }
  .file.sel span { background:var(--sel); color:#fff; outline:1px dotted #fff; }
  .file:focus-visible span { outline:1px dotted var(--ink); }
  .statusbar { margin-top:8px; padding:4px 8px; font:12px var(--pix); min-height:24px; }

  /* cv.pdf */
  .paper { background:#fff; padding:22px 24px; }
  .paper h2 { margin:0; font:600 22px/1.1 var(--pix); }
  .paper h3 { margin:18px 0 8px; font:500 12px var(--pix); text-transform:uppercase; letter-spacing:.08em; color:#6c6a64; border-bottom:1px solid #ddd; padding-bottom:4px; }
  .job { display:grid; grid-template-columns:110px 1fr; gap:10px; padding:4px 0; }
  .job b { font-weight:500; }
  .job ul { margin:4px 0 2px; padding-left:16px; font-size:12px; line-height:1.5; }
  .job li { margin:2px 0; } .job small { color:#6c6a64; }
  .skill { display:grid; grid-template-columns:110px 1fr; gap:10px; align-items:center; padding:3px 0; }
  .meter { height:12px; background:#fff; padding:2px; }
  .meter i { display:block; height:100%; background:repeating-linear-gradient(90deg,var(--sel) 0 8px,transparent 8px 10px); }

  /* contact.eml */
  .mail { display:grid; gap:8px; }
  .mail label { display:grid; grid-template-columns:56px 1fr; align-items:center; font:500 12px var(--pix); }
  .mail textarea { resize:vertical; min-height:110px; }
  .links { display:flex; gap:12px; flex-wrap:wrap; margin-left:auto; align-self:center; font:12px var(--pix); }
  .links a { color:var(--sel); }

  /* terminal */
  .win[data-id="terminal"] .content { padding:2px; }
  .term { background:#0c0d10; color:#c7f5b4; font:19px/1.15 'VT323',monospace; height:100%; min-height:260px; padding:10px 12px; overflow:auto; cursor:text; white-space:pre-wrap; }
  .term .muted { color:#6b7a6b; } .term .hl { color:#ffd25a; } .term .err { color:#ff8a8a; }
  .prompt { display:flex; gap:8px; } .prompt span { color:#7cb8ff; flex:none; }
  .prompt input { all:unset; flex:1; min-width:0; caret-color:#c7f5b4; }

  /* photos */
  .gallery h3 { margin:14px 0 6px; font:500 12px var(--pix); text-transform:uppercase; letter-spacing:.08em; color:#6c6a64; }
  .gallery h3:first-child { margin-top:0; }
  .thumbs { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; }
  .thumbs button { all:unset; cursor:pointer; aspect-ratio:1; background:#fff; padding:3px; box-shadow:0 0 0 1px #0002, 0 2px 4px #0002; }
  .thumbs img { display:block; width:100%; height:100%; object-fit:cover; }
  .thumbs button:focus-visible { outline:1px dotted var(--ink); outline-offset:2px; }
  .gallery { background:#fff; padding:12px; }
  .viewer { background:#111; display:grid; place-items:center; min-height:200px; }
  .viewer img { display:block; max-width:100%; max-height:calc(100vh - 180px); }
  .win[data-id="viewer"] .content { padding:6px; }

  .content.mood { padding:4px; } .content.mood img, .content.mood video { display:block; width:100%; height:auto; }
  .viewer video { display:block; max-width:100%; max-height:calc(100vh - 180px); }

  /* trash */
  .trash li { display:flex; align-items:center; gap:8px; padding:4px 2px; font:12px var(--pix); }
  .trash ul { list-style:none; margin:0; padding:10px; background:#fff; min-height:120px; }
  .trash img { width:16px; height:16px; image-rendering:pixelated; }

  /* ---- Taskbar ---- */
  .taskbar { position:fixed; left:0; right:0; bottom:0; height:var(--tb); z-index:100000; display:flex; align-items:center; gap:4px; padding:3px 3px;
    background:var(--face); box-shadow:inset 0 1px var(--face2), inset 0 2px var(--hi); }
  .start { display:flex; align-items:center; gap:6px; padding:5px 10px 4px 6px; height:28px; }
  .start img { width:18px; height:18px; image-rendering:pixelated; }
  .tasks { display:flex; gap:4px; flex:1; min-width:0; overflow:hidden; }
  .task { display:flex; align-items:center; gap:6px; height:28px; width:160px; min-width:0; padding:5px 8px 4px; text-align:left; }
  .task img { width:16px; height:16px; image-rendering:pixelated; flex:none; }
  .task span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .task[aria-pressed="true"] { background:repeating-conic-gradient(var(--face) 0 25%, var(--hi) 0 50%) 0 0/2px 2px; font-weight:600; }
  .tray { display:flex; align-items:center; gap:8px; height:28px; padding:0 10px; font:500 12px var(--pix); }
  .tray i { width:8px; height:8px; background:#2fbf4f; }
  .startmenu { position:fixed; left:3px; bottom:calc(var(--tb) - 2px); z-index:100001; padding:3px; width:220px; display:flex; }
  .startmenu[hidden] { display:none; }
  .startmenu .side { width:26px; background:var(--title); color:#fff; writing-mode:vertical-rl; transform:rotate(180deg); font:600 14px var(--pix); padding:8px 4px; }
  .startmenu ul { list-style:none; margin:0; padding:2px; flex:1; }
  .startmenu button { all:unset; box-sizing:border-box; width:100%; display:flex; align-items:center; gap:10px; padding:7px 8px; font:500 13px var(--pix); cursor:pointer; }
  .startmenu button:hover, .startmenu button:focus-visible { background:var(--sel); color:#fff; }
  .startmenu img { width:24px; height:24px; image-rendering:pixelated; }

  @media (max-width:700px) {
    .win { width:calc(100vw - 16px) !important; }
    .task { width:auto; flex:1; }
  }
  /* touch screens: finger-sized title-bar buttons and taskbar */
  @media (pointer:coarse) {
    :root { --tb:46px; }
    .title { height:34px; font-size:13px; padding:0 3px 0 8px; }
    .title .ti { width:20px; height:20px; }
    .ctl { gap:4px; }
    .ctl button { width:36px; height:28px; font-size:14px; }
    .ctl button[data-a="close"] { margin-left:4px; }
    .taskbar { gap:5px; padding:4px; }
    .start, .task, .tray { height:38px; }
    .start img { width:22px; height:22px; }
    .task img { width:20px; height:20px; }
    .startmenu button { padding:11px 10px; }
  }
  @media (pointer:coarse) and (max-width:700px) {
    /* icon-only task buttons so every open window keeps a tappable tab */
    .task { flex:0 0 46px; width:46px; padding:0; justify-content:center; }
    .task span { display:none; }
    .tasks { overflow-x:auto; scrollbar-width:none; }
  }
  @media (prefers-reduced-motion:reduce) { .win.open, .status i, .sprite, .sprite i, .icon::before { animation:none !important; } }
</style>
</head>
<body>
<div id="wall" aria-hidden="true"></div>
<nav class="icons" id="icons" aria-label="Bureau"></nav>

<section class="win" data-id="hello" data-title="hello.exe" data-icon="avatar" data-pos=".5,.36" style="--w:470px">
  <div class="content">
    <div class="who"><img class="avatar" data-icon="avatar" alt="Portrait pixel"><div><h1 id="hName"></h1><p id="hRole"></p></div></div>
    <p class="bio" id="hBio"></p>
    <div class="status sunken"><i></i><span id="hStatus"></span></div>
    <div class="actions">
      <button class="btn" id="copyEmail">Copier l'email</button>
      <button class="btn" id="bookCall">Prendre un rendez-vous</button>
      <button class="btn" data-open="projects">Voir les projets</button>
    </div>
    <p class="hint" id="hint">Double-clique sur les icônes pour fouiller. Tu peux aussi les déplacer.</p>
  </div>
</section>

<section class="win" data-id="projects" data-title="projets" data-icon="folder" data-pos=".28,.22" style="--w:560px">
  <div class="content">
    <div class="bar2"><button class="btn up" id="pUp" aria-label="Dossier parent">↑</button><span>Adresse</span><div class="field" id="pPath"></div></div>
    <div class="files sunken" id="files"></div>
    <div class="statusbar sunken" id="pStatus"></div>
  </div>
</section>

<section class="win" data-id="cv" data-title="cv.pdf" data-icon="doc" data-pos=".66,.16" style="--w:480px">
  <div class="content"><div class="paper sunken" id="cvPaper"></div></div>
</section>

<section class="win" data-id="contact" data-title="contact.eml" data-icon="mail" data-pos=".72,.4" style="--w:440px">
  <div class="content">
    <form class="mail" id="mailForm">
      <label>À :<input class="field" id="mTo" readonly></label>
      <label>Objet :<input class="field" id="mSubj" value="Un projet ensemble ?"></label>
      <textarea class="field" id="mBody" aria-label="Message"></textarea>
      <div class="actions" style="margin-top:4px"><button class="btn" type="submit">Envoyer</button><div class="links" id="mLinks"></div></div>
    </form>
  </div>
</section>

<section class="win" data-id="terminal" data-title="terminal.exe" data-icon="monitor" data-pos=".58,.62" style="--w:580px">
  <div class="content"><div class="term sunken" id="term"><div id="out"></div><label class="prompt"><span id="ps1"></span><input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Commande du terminal"></label></div></div>
</section>

<section class="win" data-id="player" data-title="lecteur" data-icon="monitor" data-pos=".5,.3" style="--w:720px">
  <div class="content"><div class="player sunken" id="player"></div><div class="statusbar sunken" id="playerInfo"></div></div>
</section>

<section class="win" data-id="photos" data-title="photos" data-icon="folder" data-pos=".62,.2" style="--w:560px">
  <div class="content"><div class="gallery sunken" id="gallery"></div><div class="statusbar sunken" id="gStatus"></div></div>
</section>

<section class="win" data-id="viewer" data-title="photo.jpg" data-icon="doc" data-pos=".5,.3" style="--w:640px">
  <div class="content"><div class="viewer sunken"><img id="viewImg" alt=""></div><div class="statusbar sunken" id="viewInfo"></div></div>
</section>

<section class="win" data-id="trash" data-title="Corbeille" data-icon="trash" data-pos=".36,.7" style="--w:380px">
  <div class="content trash">
    <ul class="sunken" id="trashList"></ul>
    <div class="actions"><button class="btn" id="emptyTrash">Vider la corbeille</button></div>
  </div>
</section>

<div class="startmenu raised" id="startMenu" hidden><div class="side" id="smSide"></div><ul id="smList"></ul></div>
<footer class="taskbar">
  <button class="btn start" id="startBtn" aria-expanded="false"><img data-icon="avatar" alt=""><b id="startName"></b></button>
  <div class="tasks" id="tasks"></div>
  <div class="tray sunken"><i title="Disponible"></i><span id="clock"></span></div>
</footer>

<script>

        { name: 'Regelegorila', ext: 'mp4', yt: 'UfmRgJmdplo', desc: 'Vidéo Club · le mec qui fait rage bait toute la France est dans le Vidéo Club', year: null },

        { name: 'Daniel Scheinert', ext: 'mp4', yt: 'jXk-cipJscc', desc: 'Vidéo Club · Daniel Scheinert pour la sortie de « Everything Everywhere All at Once »', year: null },

  for (let i = 0; i < 10; i++) { // soft ellipse = radial gradient in a squashed space (no ctx.filter: it is very slow on CPU canvases)
    const rx = rr(140, 340) * u, ry = rr(8, 20) * u;
    g.save(); g.translate(rr(0, W), rr(0, H * .35)); g.rotate(rr(-.12, .12)); g.scale(1, ry / rx);
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, rx); gr.addColorStop(0, `rgba(255,255,255,${rr(.18, .35)})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(0, 0, rx, 0, 7); g.fill(); g.restore(); }
  // cumulus: clusters of soft puffs, shaded underneath
  const nC = Math.round(9 + 9 * W / 1400);
  for (let i = 0; i < nC; i++) {
    const cx = rr(-.05, 1.05) * W, cy = Math.pow(r(), 1.3) * H * .48 + 10, sc = rr(.6, 1.4) * Math.max(u, .8) * (.6 + cy / H), sp = rr(80, 190) * sc, n = 26 + (r() * 26 | 0);
    for (let pass = 0; pass < 2; pass++) {
      let s2 = seed;
      for (let k = 0; k < n; k++) {
        const px = cx + (r() - .5) * sp * 2, py = cy + (r() - .5) * sp * .28;
        const rad = rr(38, 80) * sc * (1 - Math.min(.7, Math.abs(px - cx) / (sp * 1.3)));
        const oy = pass === 0 ? rad * .35 : 0;
        const gr = g.createRadialGradient(px, py - rad * .25 + oy, 0, px, py + oy, rad);
        if (pass === 0) { gr.addColorStop(0, 'rgba(170,190,215,.55)'); gr.addColorStop(1, 'rgba(170,190,215,0)'); }
        else { gr.addColorStop(0, 'rgba(255,255,255,.97)'); gr.addColorStop(.55, 'rgba(250,252,255,.75)'); gr.addColorStop(1, 'rgba(235,243,252,0)'); }
        g.fillStyle = gr; g.beginPath(); g.arc(px, py + oy, rad, 0, 7); g.fill();
      }
      if (pass === 0) seed = s2; // replay the same puffs for the bright pass
    }
  }

  // rolling hills, back to front
  const L = [
    { base: .62, a: [[.022, 1.3, .2], [.01, 3.1, 1.1]], top: '#a9c7b8', bot: '#8db191', l: [58, 68], dens: 0, len: [1, 1], trees: 0 },
    { base: .665, a: [[.045, 1.1, 2.0], [.016, 2.7, .4]], top: '#a4c768', bot: '#729d3f', l: [40, 56], dens: .5, len: [1, 2], trees: 14 },
    { base: .76, a: [[.06, .8, 4.1], [.02, 2.2, 1.7]], top: '#93c552', bot: '#5c8b2b', l: [32, 50], dens: 1.1, len: [2, 4], trees: 5 },
    { base: .885, a: [[.04, .9, .7], [.015, 2.4, 3.3]], top: '#82b941', bot: '#3c6a1c', l: [22, 44], dens: 2.4, len: [4, 10], trees: 0 },
  ];
  const yAt = (l, x) => H * l.base + l.a.reduce((s, [A, f, p]) => s + Math.sin(x / W * Math.PI * 2 * f + p) * A * H, 0);
  const path = (l, dy = 0) => { g.beginPath(); g.moveTo(-10, H); for (let x = -10; x <= W + 10; x += 4) g.lineTo(x, yAt(l, x) + dy); g.lineTo(W + 10, H); g.closePath(); };
  L.forEach((l, i) => {
    if (i) for (const d of [16, 10, 5]) { g.fillStyle = 'rgba(20,50,20,.07)'; path(l, -d * u); g.fill(); } // soft cast shadow
    path(l);
    const lg = g.createLinearGradient(0, H * (l.base - .07), 0, H); lg.addColorStop(0, l.top); lg.addColorStop(1, l.bot);
    g.fillStyle = lg; g.fill();
    g.save(); path(l); g.clip();
    for (let k = 0; k < 6; k++) { // sun patches and cloud shadows
      const x = rr(0, W), y = yAt(l, x) + rr(10, 90) * u, rad = rr(80, 260) * u, sun = r() < .6;
      const gr = g.createRadialGradient(x, y, 0, x, y, rad);
      gr.addColorStop(0, sun ? 'rgba(235,245,150,.16)' : 'rgba(20,45,15,.14)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    }
    const count = W * l.dens * (H * (1 - l.base)) / 160 | 0;
    g.lineWidth = Math.max(1, u * (i === 3 ? 1.2 : 1));
    for (let k = 0; k < count; k++) {
      const x = rr(-5, W + 5), y0 = yAt(l, x), t = Math.pow(r(), .85), y = y0 + t * (H - y0) + 2;
      const len = rr(l.len[0], l.len[1]) * u * (.5 + t);
      g.strokeStyle = `hsla(${rr(78, 104)},${rr(35, 60)}%,${rr(l.l[0], l.l[1])}%,.55)`;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + rr(-.4, .4) * len, y - len); g.stroke();
    }
    g.restore();
    for (let tr = 0; tr < l.trees; tr++) { // tree clumps hugging the crest
      const x = rr(0, W), y = yAt(l, x) + rr(4, 40) * u * (i === 1 ? .6 : 1.4), n = 3 + (r() * 7 | 0), s = (i === 1 ? .6 : 1.3) * u;
      g.fillStyle = 'rgba(15,35,10,.25)'; g.beginPath(); g.ellipse(x + 4 * s, y + 5 * s, n * 3 * s, 3 * s, 0, 0, 7); g.fill();
      for (let k = 0; k < n; k++) { const rad = rr(3, 7) * s;
        g.fillStyle = `hsl(${rr(95, 115)},${rr(35, 50)}%,${rr(17, 27)}%)`;
        g.beginPath(); g.arc(x + rr(-n, n) * 2.2 * s, y - rr(0, 6) * s, rad, 0, 7); g.fill(); }
    }
    g.strokeStyle = 'rgba(235,250,175,.28)'; g.lineWidth = 2 * u; g.beginPath();
    for (let x = -10; x <= W + 10; x += 4) g.lineTo(x, yAt(l, x) + 1); g.stroke();
  });
  const vg = g.createRadialGradient(W / 2, H * .45, Math.min(W, H) * .4, W / 2, H * .5, Math.max(W, H) * .8);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,10,30,.22)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  wall.style.backgroundImage = `url("${cv.toDataURL('image/jpeg', .92)}")`;
}
const wallpaper = C.wallpapers.length ? C.wallpapers[Math.random() * C.wallpapers.length | 0] : '';
paint();
let rt;
addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    paint();
    DESK.forEach(d => placeIcon(d.el, d));
    Object.values(wins).forEach(w => { if (w.classList.contains('open')) place(w); });
  }, 120);
});

if (!mobile()) moodPick.forEach(id => openWin(id));
openWin('hello');
